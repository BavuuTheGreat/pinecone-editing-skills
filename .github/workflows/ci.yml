name: CI

on:
  push:
    branches: [main, pinequest-long-answer, factory-automation, reorg-skills, factory-ui-v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE: plugins/pinecone-video/skills/interview-reel/engine

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Compile every engine python file
        run: |
          find "$ENGINE" -name node_modules -prune -o -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Engine unit tests (pure functions, no ffmpeg or footage)
        working-directory: ${{ env.ENGINE }}
        run: python -m unittest discover -s tests -v

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Factory unit and security tests (stdlib only)
        working-directory: factory
        run: python -m unittest discover -s tests -v
      - name: Install ffmpeg (for the smoke clip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: CLI end-to-end smoke (tick, status, approve, done, review in a throw-away FACTORY_HOME)
        working-directory: factory
        run: bash tests/e2e_smoke.sh

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/check_manifests.py
      - run: python -m unittest discover -s scripts -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Bandit (fails on medium severity and above)
        run: |
          pip install bandit==1.9.4
          bandit -r "$ENGINE/pinequest.py" "$ENGINE/engineers.py" "$ENGINE/run.py" "$ENGINE/new_batch.py" "$ENGINE/reelpipe" \
            factory/factory assets/fetch_assets.py -ll
      - name: Secret scan (gitleaks, free for user-owned repos)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
